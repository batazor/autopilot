# RU «Белая мгла»: detect the welcome-back offline-income dialog by its Cyrillic
# title «С возвращением!» (OCR), since the EN `text.welcome_back` template miss-es
# it. Same priority as the base rule (3) so it probes before the rewards screens.
# Regions (text.welcome_back bbox) come from the base welcome_back area.yaml.
screens:
  welcome_back:
    priority: 3
    rules:
    # Primary: template-match the RU «возвращением» title crop. tesseract:rus
    # garbles this stylised banner font into Latin ('C Bo3BpalieHvem!' — live
    # bs3 2026-08-08), so the OCR rule below never fired and the popup fell
    # through to «unknown» → dismiss_unknown_popup looped and starved intel.
    - match: text.welcome_back_ru
      threshold: 0.82
    # OCR fallback (kept for a future font that reads clean); harmless when the
    # template already matched.
    - ocr: text.welcome_back
      contains: [возвращени, Welcome]
      threshold: 0.4
