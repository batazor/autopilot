enabled: true
name: "Mail ${tab_name}: Claim Rewards"
priority: 80_000

node: mail.${tab}

steps:
  # Static zone (bottom-right of the bar) — BLIND tap, no OCR / template gate:
  # the label is localized text (EN "Read & Claim All", RU «Прочесть и получить
  # всё») but the zone never moves. One tap claims the whole tab and marks
  # rewardless mail read (clearing the tab red dot that fed the re-push loop);
  # on an empty tab it lands on background and is a no-op.
  - click: mail.claim.all
  - wait: 1.5s
  # If a claimed-rewards card popped, this second tap lands "anywhere" on the
  # card and dismisses it; otherwise it re-taps the same static zone (no-op or
  # a second claim batch).
  - click: mail.claim.all
  - wait: 1s
