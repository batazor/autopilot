# Troop training cost + time per tier (T1..T11) — game FACTS.
#
# Cost is per ONE troop and — contrary to the original stub's assumption —
# DIFFERS by troop type (infantry is meat-heavy, marksman wood-heavy, lancer
# in between), so each row carries a `by_type` map. Training TIME is identical
# across the three types at a given tier, so `time` stays per-row.
#   tier    — camp troop level 1..11 (T1 Rookie … T11 Helios)
#   time    — per ONE troop, "HH:MM:SS"
#   by_type — per-type cost per ONE troop: meat / wood / coal / iron
# Promotion (T_n → T_{n+1}) pays only the DIFFERENCE — derived from these
# per-tier costs by games/wos/troops/planner/training_costs.py (no separate
# data needed).
#
# Source: cross-verified 2026-07-06 against two independent community
# calculators — onechilledgamer.com/whiteout-survival-troop-cost-calculator
# (inline `troopData`) and woscalculator.com/scripts/troops.js — which agree
# on every value (woscalculator stores time in decimal minutes; converted).
tiers:
