# Russian item vocabulary for the «Белая мгла» (``wos_ru``) client.
#
# The solver keys taps by item name, and scene points are named in English (the
# wostools catalog). Under the RU catalog the game prints the same items in
# Russian, so every OCR'd word misses. This maps each point name to the Russian
# word(s) the RU client shows for it; the aliases resolve to the same tap point
# and also let a scene be recognised from Russian words alone.
#
# Values may be one word or a list of wordings (the game's exact phrasing isn't
# always the obvious translation, and OCR under ``rus`` can read either form).
# Keys mirror the point names verbatim — including the community sheets'
# misspellings ("Parachutte", "Laddle") — because the alias has to reach the
# point that actually exists in the scene. Fuzzy matching absorbs the rest.
#
# Unknown words are not fatal: the solver's helper-learn flow can still find an
# unmapped item via the in-game hint. Add what it learns here so the next run is
# a direct hit.

