name: Dreamscape Memory — solve picked scene (no detection)
enabled: true
# Device-level: the solver only reads the screen and taps — it holds no
# per-account state, so it runs standalone (manual "Start solving" / overlay
# rule) without a bound player.
device_level: true
priority: 90_000

# Operator-picked round: the scene is fixed to the DB's active scene (chosen on
# the game page's Guides tab or via the standalone runner's --scene), so the
# loop skips word-based scene detection and spends every tick on word OCR +
# taps. Fails fast if no scene is active.
steps:
  - exec: dreamscape_memory_solve_loop
    mode: solo
    scene_source: active
    # The operator presses Play once and then plays chapter after chapter:
    # the solver idles between rounds (reading empty slots) and must survive
    # the whole session, not one round. A 5m ttl died while the operator was
    # still in the "choose your ending" dialog — the round then started
    # against an empty queue.
    ttl: 45m
    max_iterations: 30000
    # Fast tick: no scene detection in this loop, OCR runs concurrently
    # (~40ms for the word slots) and capture streams at 10fps — 100ms keeps
    # the solver hot without outrunning the capture interval.
    wait: 100ms
    tap_delay: 0ms
