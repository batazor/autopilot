enabled: true
name: Alliance Tech Contribute
node: alliance.tech
priority: 70_000
cron: "17 */6 * * *"

steps:
  # The green "recommended tech" finger is the ONLY template match here; tapping
  # it opens the contribution popup, whose layout is fixed.
  - while_match: alliance.tech.add
    max: 1
    retry:
      attempts: 5
      interval: 500ms
    steps:
      - click: alliance.tech.add
      - wait: 1s
      # Right BLUE «Сделать взнос» button is at a FIXED position — blind-tap it
      # while it stays blue (invest still allowed). It greys out when the daily
      # contribution limit is spent, which the colour_check catches to end the
      # loop. NEVER the left ORANGE «💎» button (that spends gems). No OCR —
      # position is fixed, blue-vs-grey is the only signal.
      - while_match: alliance.tech.contribute.blue
        max: 25
        retry:
          attempts: 2
          interval: 300ms
        steps:
          - long_click: alliance.tech.contribute
            wait: 1s
          - wait: 100ms
      - click: alliance.tech.contribute.close
      - wait: 1s
