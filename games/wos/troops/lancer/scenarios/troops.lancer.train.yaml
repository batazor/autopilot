enabled: true
name: "Troops: train lancer"
node: main_menu

# Navigate to the camp via the City-panel training row (OCR scroll-find), NOT the
# static main_menu→lancer edge: that edge taps a fixed bbox tuned to the EN panel
# layout and mis-fires on the RU «Белая мгла» build, whose panel sits lower and
# scrolls. The scroll-find matches the row by title and works on both builds, and
# collects a ready batch as a side effect. Camp options-ring / Train-screen button
# positions were verified identical to the EN bboxes on a live RU walk → taps are
# positional (EN-text gates never match RU and only forced a ring-closing
# double-tap). See troops.infantry.train for the full rationale.

steps:
  - exec: tap_training_accept
    troop: lancer
  - wait: 2s
  - wait_screen:
      any: [main_city]
      max: 8
      interval: 500ms
  - click: main_city.center_building
  - wait: 1.5s

  - click: lancer.complete
  - wait: 1.2s
  - click: troops.options.train
  - wait: 1.5s

  - while_match: troops.tap_anywhere
    max: 1
    steps:
      - click: troops.tap_anywhere
      - wait: 1s

  - while_match: train.upgrade
    max: 1
    steps:
      - click: train.upgrade
      - wait: 1s
      - click: troops.upgrade.start
      - wait: 1s
      - click: troops.promotion
      - wait: 1.5s
    else:
      - click: troops.train.start
      - wait: 1.5s

  # Нехватка ресурсов → «Использовать припасы» (см. troops.infantry.train).
  - ocr: troops.train.confirm_dialog
    store: troops.train.confirm_dialog
  - cond: troops.train.confirm_dialog ~= "припас|недостаточно|использов|подтверд|not enough|insufficient"
    steps:
      - click: troops.train.use_supplies
      - wait: 1s
      - click: troops.train.start
      - wait: 1.5s

  - ocr: troops.train.timer
    event_timer: troops.lancer.training
  - push_scenario:
      name: troops.lancer.train
      delay: "troops.lancer.training + 1m"
