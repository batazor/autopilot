# Reads the current stamina off whichever screen shows it and stores it for the
# allocator. The OCR step auto-writes a sibling `stamina_at` timestamp, so the
# adapter can interpolate regen (1 / 5 min) between reads.
#
# Both branches are soft guards (match + steps): on a miss they just fall
# through, so this is safe to run on any screen. Trigger wiring (overlay rule on
# these screens / read-after-consume) is a follow-up — for now it runs when
# pushed or when the bot already sits on chief_profile / intel.
name: Read stamina
enabled: true
cron: "*/5 * * * *"                   # periodic; bot idles on home screens → bar read
steps:
  # main_city / main_world: measure the green fill-bar under the avatar. Self-
  # validating — a no-op off those screens (the bbox won't look like a bar), so
  # it's safe to run unguarded. Covers the screens the bot sits on most.
  # NOTE: this exec writes `stamina` DIRECTLY (no `store:` declaration), so — like
  # read_intel_stamina below — it never triggers the scenario-start store-HDEL.
  - exec: read_stamina_bar
    region: stamina.bar

  # NB: the chief-profile branch used to `ocr: chief_profile.stamina store: stamina`
  # — but `store:` fields are HDEL'd at scenario start across ALL branches, so this
  # cron (every 5 min) WIPED `stamina` up front, and on the RU build the avatar bar
  # is unreadable (read_stamina_bar returns not_a_bar without rewriting), leaving
  # stamina EMPTY → the MARCH coordinator (intel_intent) stops dispatching intel
  # entirely (bs4 2026-08-10). Dropped: on RU the intel board (read_intel_stamina)
  # is the real source, and it now persists instead of being wiped.

  - match: intel.title                # intel screen → «current/max» bottom-left bar
    threshold: 0.85
    steps:
      - exec: read_intel_stamina      # OCRs «44/90», parses + stores current + max
