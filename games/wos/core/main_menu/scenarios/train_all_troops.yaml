enabled: true
name: "🪖 Принять и перезапустить все войска"
priority: 82_000

# Один проход по всем трём лагерям. Толкаем troops.<type>.train для каждого рода
# войск; каждый сценарий сам: находит свою строку в City-панели по названию
# (Пехота/Копейщики/Стрелки — OCR scroll-find, устойчиво к прокрутке и работает
# и на EN, и на RU «Белая мгла»), переходит к лагерю, собирает готовую партию,
# открывает кольцо опций → «Обучение», ставит новую партию (с обработкой
# «Недостаточно ресурсов» → «Использовать припасы»), снимает таймер обучения и
# саморепушится через таймер+1мин. Один сценарий = принять + перезапустить все
# три рода войск.
node: main_menu

steps:
  - push_scenario: troops.infantry.train
  - push_scenario: troops.lancer.train
  - push_scenario: troops.marksman.train
