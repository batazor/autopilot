# Arena of Glory screens — detected by OCR on their titles (robust to the
# stylised banners the game reskins; the title text is stable). All four are
# modal-ish full screens reached from inside the Arena building.
screens:
  # The three in-flight screens are driven entirely by the arena.fight scenario
  # (tap-through), so the navigator never needs to route between them.
  # Generic battle-result screen, shared by arena.fight, exploration (squad_fight)
  # and tundra_trek — all visually identical. NOT terminal: it now has an outgoing
  # `arena.result -> main_city` edge (via the "Return to City" button) in
  # edge_taps.yaml so the navigator can always recover home, no matter which
  # feature stranded the bot here.
  arena.result:
    priority: 20
    rules:
      - ocr: arena.result.exit
        # RU «Для выхода нажмите в любом месте» (confirmed live on bs5 intel-battle result).
        contains: ["anywhere", "exit", "выхода", "любом месте"]

  # The arena.fight scenario taps through challenge_list -> squad -> fight itself,
  # but both are detectable dialogs over the Arena building, so a scenario that
  # aborts mid-flow (or a navigating cron firing on the dialog) would strand the
  # bot here. NOT terminal: each now carries an outgoing `-> arena` edge (Android
  # BACK, which closes the dialog) in edge_taps.yaml, and arena -> main_city
  # already exists, so the navigator can always recover home.
  arena.challenge_list:
    priority: 24
    rules:
      - ocr: arena.challenge_list.title
        # RU guess «Список вызовов» (token «вызов») — VERIFY LIVE.
        contains: ["Challenge List", вызов]

  arena.squad:
    priority: 24
    rules:
      - ocr: arena.squad.title
        # RU guess «Отряд» — VERIFY LIVE.
        contains: ["Squad", "Settings", Отряд]

  arena:
    priority: 30
    rules:
      - ocr: arena.title
        # RU guess «Арена славы» (token «Арена») — VERIFY LIVE.
        contains: ["Arena of Glory", "Glory", Арена]
