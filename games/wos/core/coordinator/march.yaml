# Autonomous MARCH-channel planner (scheduler `_run_march_planner` →
# coordinator.run_march_tick).
#
# Dispatch-blind: each scheduler tick, per player, the coordinator fills idle
# march slots with the best MARCH-spending candidate — a blind intel run and any
# active timed events (Romance Season, …) — under the shared budget. It contends
# on the slot count from the resource world (marches.capacity/active_count, read
# by sync_main_menu_marching_status) but is INDEPENDENT of resources/actions.yaml
# `enabled` (that gates troop/hero/gather actions, which intel doesn't need).
#
# LIVE — only ever queues real, runnable scenarios (intel_run /
# event.romance_season), bounded by stamina, the intel cooldown, slots_free and
# skip_if_duplicate. Per-deployment kill-switch: set WOS_MARCH_ENABLED=false to
# disable without editing this file (or =true to force-enable a dormant one).
enabled: true

# Min seconds between coordinator intel dispatches. This is only the SAFETY NET:
# within a board window tap_intel_fight chains itself back-to-back (maybe_chain_
# after_tap), so the coordinator just needs to RESUME the sweep after the chain
# ends on "no free march slot" — i.e. shortly after a march returns and frees a
# slot. An empty board is already suppressed by the board_cache exhaustion check,
# so a short interval can't spam a cleared board. Was 900s, which stranded a
# full board for ~15 min after each slot-limited batch (live bs3 2026-08-08).
intel_cooldown_s: 60
