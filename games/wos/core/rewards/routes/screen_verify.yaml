# Rewards popup detection — ribbon popups share the same banner shape, so they
# are treated as one dismissible rewards modal. The VIP-styled white popup still
# uses its legacy title landmark because it has no ribbon.
screens:
  rewards.upgraded:
    priority: 4
    rules:
    # AND-gate: an orange ribbon ALONE is not enough. The Dawn Market shop page
    # wears an orange header banner that clears every ribbon metric (mask ~0.81,
    # component y ~0.07, height ~0.93) and, at priority 4, hijacked the node
    # before shop.dawn_market (priority 50) was ever evaluated. The two surfaces
    # differ only by their title text, so gate the ribbon on an OCR read of the
    # banner: the genuine popup reads "Rewards Upgraded!" (→ contains "Upgraded"),
    # while the shop reads "Dawn Market" (→ empty under the title_line preprocess
    # set on rewards.upgraded.title). The ``match`` and ``ocr`` conditions live in
    # ONE rule entry, so they are AND-ed — a landmark group fires only when every
    # member matches (separate list entries would be OR-ed instead).
    - match: rewards.ribbon
      action: reward_ribbon
      type: orange
      threshold: 0.35
      # 0.04 floor (the top-aligned onboarding-band reject, see the detector test):
      # the real upgraded-popup orange ribbon sits at component y_ratio ~0.065 on
      # page.rewards_upgraded.png.
      min_component_y_ratio: 0.04
      min_component_height_ratio: 0.7
      ocr: rewards.upgraded.title
      contains: "Upgraded"

  rewards:
    priority: 5
    rules:
    - match: rewards.ribbon
      action: reward_ribbon
      type: blue
      threshold: 0.35
      min_component_y_ratio: 0.15
      min_component_height_ratio: 0.7
      # 0.40 area floor: the "Welcome back!" offline-income popup's blue title
      # banner clears every other ribbon gate (mask ~0.50, width ~0.94) but its
      # largest blue contour fills only ~0.25 of the bbox vs ~0.52-0.54 for a
      # real rewards ribbon. Without this floor the popup is misread as `rewards`
      # and the bot runs rewards edges (exit_rewards_popup / alliance.war /
      # rewards→main_city) instead of confirming. Mirrors the overlay-rule floor.
      min_component_area_ratio: 0.40
    # Title stays on template: rewards / rewards.upgraded share the same
    # "Rewards" banner and differ only by ribbon colour, so OCR contains:
    # "Rewards" also matches the upgraded popup.
    - match: rewards.title.v2
      threshold: 0.9
