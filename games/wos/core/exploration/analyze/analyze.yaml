overlay:
  - name: exploration.squad_fight.visible
    region: page.squad_fight.title
    action: findIcon
    threshold: 0.9
    screens:
      - squad_settings
      - exploration.squad_fight
    set_node: exploration.squad_fight
    ttl: 2s

  # The Auto-battle toggle is BLUE while OFF and orange once ON. Detect the blue
  # (off) state by colour and tap to enable — locale- AND build-proof. The label
  # reads "Auto" on every build (it is not localised), but the «Белая мгла» build
  # renders the button differently enough that the English "Auto" crop only
  # scored 0.78, so the old findIcon@0.9 never fired on RU. Colour has no such
  # gap, and it doubles as the on/off state probe (mirrors furnace.max_power.off):
  # once ON the button turns orange, the blue check stops matching, and we never
  # re-toggle it back off.
  - name: exploration.squad_fight.auto.inactive
    region: page.squad_fight.auto
    action: color_check
    type: blue
    threshold: 0.4
    screens:
      - exploration.squad_fight
    cond: exploration.level >= 5
    ttl: 10s
    steps:
      - click: page.squad_fight.auto
      - wait: 1s

  - name: exploration.squad_fight.speed.inactive
    region: page.squad_fight.speed
    action: findIcon
    threshold: 0.9
    screens:
      - exploration.squad_fight
    cond: exploration.level >= 10
    ttl: 10s
    steps:
      - click: page.squad_fight.speed

  - name: main_city.to.exploration.has_reward
    region: main_city.to.exploration
    threshold: 0.98
    isRedDot: true
    screens:
      - main_city
    steps:
      - push_scenario:
          name: claim_exploration_rewards
          ttl: 1m
