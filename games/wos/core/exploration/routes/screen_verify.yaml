screens:
  exploration:
    priority: 30
    # Identify the page by its title plate alone. The title OCRs in the worker's
    # catalog language (``wos_ru`` → ``rus``), so listing both the EN "Exploration"
    # and RU «Освоение» strings makes the one rule cover both builds. The old
    # second rule (``match: exploration.to.squad_settings``) AND-gated detection
    # on an English button crop that never matches the RU «Освоить» button, so the
    # «Белая мгла» build fell through to dismiss_unknown_popup. The bottom button is
    # now reached as a locale-free blind-tap edge, so it is no longer a landmark.
    rules:
    - ocr: page.common.title
      contains: [Exploration, Освоение]
      threshold: 0.8
  squad_settings:
    priority: 30
    # Title plate reads "Squad Settings" / RU «Настройки отряда». The squad-deploy
    # buttons («Быстрая отправка» / «Биться») are blind-tap-by-position so the
    # whole flow is locale-free except this title.
    rules:
    - ocr: page.common.title
      contains: [Squad Settings, Настройки отряда]
      threshold: 0.8
  exploration.squad_fight:
    priority: 25
    # The in-progress battle animation. Genuinely transient: it has no exit
    # affordance other than the pause button (tapping which is unpredictable and
    # we WANT to wait the fight out, which the squad_fight scenario does via
    # `wait_screen`). It always auto-resolves to exploration.victory /
    # exploration.defeat, both of which now carry an outgoing `-> main_city` edge,
    # so a navigating cron that fires mid-battle recovers on the next tick once
    # the result screen appears (the stuck-task watchdog backstops a true hang).
    # terminal:true keeps the navigator from trying to route off the battle.
    terminal: true
    rules:
    - match: page.squad_fight.title
      threshold: 0.9
  exploration.victory:
    # Probe before arena.result (priority 20): the arena result screen is
    # detected by a generic "tap anywhere to exit" OCR that ALSO matches these
    # exploration battle-result screens. At equal priority arena.result wins the
    # tie and steals detection, which makes squad_fight's victory/defeat
    # wait_screen time out and leaves the bot stuck on the result screen.
    priority: 18
    # Battle-result screen; squad_fight taps `Continue` to dismiss in-flow. NOT
    # terminal: it now carries an outgoing `exploration.victory -> main_city` edge
    # (via the "Return to City" button) in edge_taps.yaml, so the navigator can
    # recover home if the bot strands here outside its own scenario.
    rules:
    - ocr: page.exploration.victory.title
      contains: [Victory, Победа]
    # OR-probe for the INTEL auto-battle result card, which sits ~50px lower —
    # the primary bbox clips its title to garbage (see the title2 region note).
    - ocr: page.exploration.victory.title2
      contains: [Victory, Победа]
    # OR-probe for the RU squad-fight card with upsell rows — the banner sits
    # ~60px HIGHER than the primary bbox (see the title0 region note).
    - ocr: page.exploration.victory.title0
      contains: [Victory, Победа]
  exploration.defeat:
    # See exploration.victory — beat the generic arena.result matcher (20).
    priority: 18
    rules:
    - ocr: exploration.defeat.title
      contains: [Defeat, Поражение]
    - ocr: exploration.defeat.title2
      contains: [Defeat, Поражение]
    # OR-probe for the RU squad-fight card with upsell rows — the banner sits
    # ~60px HIGHER (measured live on bs5: 'Поражение!' read cleanly here while
    # title landed on the plate edge and title2 on the upsell header).
    - ocr: exploration.defeat.title0
      contains: [Defeat, Поражение]
