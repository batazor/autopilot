enabled: true
name: Dismiss popup on unknown screen

device_level: true
priority: 70_000

# Onboarding is gated at the enqueue point (``_maybe_dismiss_unknown_popup``):
# while furnace < 5 the dismisser is not enqueued at all, so it can't fight the
# tutorial. No furnace cond here — gating in the scenario would still enqueue it
# every unknown-screen tick only to bail.
cond: currentNode == unknown

steps:
  - cond: currentNode == unknown
    steps:
      - while_match: rewards.upgraded.tap_anywhere_to_exit
        max: 1
        steps:
          - click: rewards.upgraded.tap_anywhere_to_exit
          - wait: 1s

      - while_match: button.tap_anywhere_to_exit
        expected: ["tap anywhere"]
        max: 1
        steps:
          - click: button.tap_anywhere_to_exit
          - wait: 1s

      - while_match: button.free
        max: 1
        steps:
          - click: button.free
          - wait: 1s

      - while_match: claim_button_close
        max: 1
        steps:
          - click: claim_button_close
          - wait: 1s

      - while_match: icon.page.back
        max: 1
        steps:
          - click: icon.page.back
          - wait: 1s

      - while_match: button.click_to_continue
        max: 1
        steps:
          - click: button.click_to_continue
          - wait: 1s

      - while_match: heroes.sr.new.close
        max: 1
        steps:
          - click: heroes.sr.new.close
          - wait: 1s

      # Green «Получить»/Claim CTA on a reward popup (beast-hunt victory, etc.).
      # Colour-matched (action + color explicit on the step, as the DSL matcher
      # needs — mirrors claim_exploration_rewards) BEFORE the OCR
      # claim_on_unknown fallback below, which reads NOTHING off the
      # white-on-green label (tesseract:rus) and left the bot looping here
      # forever (bs3 2026-08-09).
      - while_match: button.reward_receive_cta
        action: cta_button
        color: green
        threshold: 0.5
        max: 1
        steps:
          - click: button.reward_receive_cta
          - wait: 1s

  # Template regions above are safer and produce meaningful approval labels.
  # When none matched, OCR the whole frame for a Claim/Collect button and press
  # it — this catches reward pages (e.g. Labyrinth Treasure) whose green Claim
  # button sits *below* the info card, where the detector's card-centre tap
  # misses. Purchase-guarded: never taps a paid CTA.
  - exec: claim_on_unknown

  # Finally, fall back to the game-wide popup detector (X / tap-anywhere /
  # escalate) when no Claim button was found either.
  - exec: dismiss_popup
