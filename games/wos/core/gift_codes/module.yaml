id: gift_codes
title: Gift Codes (in-game)
description: >-
  In-game redemption of gift codes via Settings → Gift Code → Redeem Bundle for
  builds the public gift-code API rejects — the beta build (codes from Discord,
  game="wos_beta") and the Russian "Белая мгла" re-skin (manually entered codes,
  game="wos_ru"). The running build picks the code set; canonical wos is skipped
  (it uses the API). Attempts are stamped into gift_code_redemptions.
scenarios: scenarios
wiki: false
