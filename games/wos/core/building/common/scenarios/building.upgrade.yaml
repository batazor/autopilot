enabled: true
name: 🏗️ Building upgrade (chapter task)
navigate: false
nodes:
- main_city
- chapter
- enlistment_office
- barricade
- marksman_camp
- lancer_camp
- infantry_camp
- research_center
- infirmary
- command_center
- embassy
- storehouse
- furnace
- clinic
- shelter
- cookhouse
- hero_hall
- iron_mine
- sawmill
- coal_mine
- hunters_hut
- dawn_academy
- beast_cage
- lighthouse
- arena
- chiefs_house
- suggestion_box
- explorers_cabin
- crystal_laboratory
- war_academy
- fire_crystal_marksman_camp
- fire_crystal_infantry_camp
- fire_crystal_lancer_camp
- fire_crystal_embassy
- fire_crystal_infirmary
- fire_crystal_command_center
- fire_crystal_furnace
steps:
# Two ways in to the target building, both via the game's own «what to do next»
# pointer (no per-account citymap scan needed):
#   • from the hub: tap the bottom-left objective plate (chapter.task);
#   • from the story «Глава»/Chapter screen: tap the active objective's blue
#     «Вперёд»/«Go» button (chapter.objective.go) — cta_button so the colour
#     search taps whichever Вперёд renders (top row = active objective).
# After either tap currentNode becomes the building and the loop below runs.
- cond: currentNode == chapter
  steps:
  - while_match: chapter.objective.go
    action: cta_button
    color: blue
    threshold: 0.5
    max: 1
    steps:
    - click: chapter.objective.go
    - wait: 2s
- cond: currentNode == main_city
  steps:
  - click: chapter.task
  - wait: 2s
- cond: currentNode == furnace
  steps:
  - ocr: furnace.name
    store: building.name
    # RU «Белая мгла» titles OCR at ~0.5 confidence (rus script, stylised font);
    # the default 0.9 region floor would drop them and the reader would never
    # record a level. sync_building_name's parser is the real correctness gate
    # (rejects unparseable text, levels are monotonic), so a low floor is safe.
    threshold: 0.4
- cond: currentNode != furnace
  steps:
  - ocr: building.title
    store: building.name
    threshold: 0.4  # RU titles read ~0.5 conf; parser gates correctness (see above)
- exec: sync_building_name
- loop:
    max: 10
    steps:
    # «Белая мгла» (RU) building panels are furniture-interiors that stack TWO
    # «Улучшить» pills — the building pill (upper) + the selected-furniture pill
    # (lower) — and the building pill renders HIGHER than the single-pill EN
    # `upgrade_button` anchor (measured on RU «Угольный рудник»: pill at y≈42%,
    # the RU `upgrade_button` anchor sits at y≈51% and only scores ~0.86, so it
    # intermittently misses). Probe the upper pill first via `upgrade_button_top`
    # (the same region shelter.upgrade uses); re-searched fresh each outer-loop
    # iteration so we follow the button as it greys/moves. EN has no
    # `upgrade_button_top` region → the block resolves no row and is skipped.
    - while_match: upgrade_button_top
      action: cta_button
      color: blue
      threshold: 0.5
      max: 1
      steps:
      - long_click: upgrade_button_top
        wait: 5s
    - while_match: upgrade_button
      action: cta_button
      color: blue
      threshold: 0.5
      max: 5
      steps:
      - wait: 2s
      - long_click: upgrade_button
        wait: 5s
      - wait: 1s
    - while_match: button.next
      action: cta_button
      color: blue
      threshold: 0.5
      max: 1
      steps:
      - wait: 2s
      - click: button.next
      - wait: 2s
    - while_match: build_building_item
      action: cta_button
      color: blue
      threshold: 0.5
      max: 1
      steps:
      - wait: 2s
      - click: build_building_item
      - wait: 2s
    - while_match: upgrade_big_button
      action: cta_button
      color: blue
      threshold: 0.5
      max: 1
      steps:
      - wait: 2s
      - click: upgrade_big_button
      - wait: 2s
- ocr: building.upgrading.time
  type: time
  throttle_push: building.upgrade
# Persist this building's construction ETA (finishes_at) so the fleet knows what
# is under construction and the planner counts genuinely-free build queues.
- exec: record_build_eta
