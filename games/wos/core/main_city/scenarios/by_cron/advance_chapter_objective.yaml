name: "🧭 Idle: route Chapter objective (build/upgrade/route)"
enabled: true

# Idle fallback: when the instance has no real work queued and sits on the hub,
# follow the game's own "what to do next" pointer — the bottom-left Chapter
# objective tracker (chapter.task), e.g. "Upgrade Coal Mine". route_chapter_objective
# resolves it: a building objective is gated by the build planner and handed to
# building.upgrade (which taps chapter.task to navigate — no per-account citymap
# scan needed); other objective types route via chapter_objectives.yaml.
#
# A low priority makes this a pure idle filler: the cron publishes on its
# interval, but at 25k it sits below every real cron/overlay push (68k+), so it
# only actually runs once the queue has drained. Mirrors the cron + main_city
# idiom of check_main_city.yaml.
cron: "*/4 * * * *"
priority: 25_000

# Onboarding gate (mirror check_main_city): below furnace 5 the Chapter IS the
# tutorial — let onboarding drive it instead of fighting it.
min_furnace_level: 5

node: main_city

steps:
  - exec: dismiss_popup
  - ocr: chapter.task
    store: chapter.task
    # Stylised / RU plate text reads at low confidence; the name parser and the
    # objective registry are the real correctness gate (an unparseable read just
    # routes to "unrecognised" and no-ops), so a low floor is safe.
    threshold: 0.4
  - exec: route_chapter_objective
