overlay:
  # Auto-dismiss the exit dialog. Once screen_verify has identified `exit_confirm`
  # (body crop), PUSH the dismiss_exit_confirm scenario rather than tapping inline.
  # The inline overlay click is gated by the rolling tick (skipped while a task is
  # busy / screen-detect is skipped), so with active_player empty and who_i_am
  # looping the dialog sat un-dismissed 24s+ (op-reported bs3 2026-08-12). A pushed
  # device_level scenario at priority 130k becomes a durable queue item that
  # preempts who_i_am (101k) and runs to completion, tapping «Отмена». NEVER tap
  # exit_confirm.confirm — that quits the game.
  - name: exit_confirm.cancel.auto
    region: exit_confirm.body
    action: findIcon
    threshold: 0.9
    device_level: true
    priority: 130_000
    ttl: 5s
    screens:
      - exit_confirm
    steps:
      - push_scenario:
          name: dismiss_exit_confirm
          priority: 130_000
