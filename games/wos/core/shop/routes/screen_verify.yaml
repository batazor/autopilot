families:
  shop:
    hub: shop
    prefix: shop.
    tab_region: shop.tabs_strip
    namespace: shop
    advance_scenario: tabs.strip.advance
    next_region: shop.tab.next_page

# Shop sub-pages: use ``parent: shop`` so the parent's ``page.shop.title`` is the
# shared gate, plus ONE specific landmark per sub-page (sub-page title or tab).
# Rules across multiple list entries are OR-ed (any matches → screen wins), so
# the parent title MUST NOT be repeated as a separate sub-page rule — otherwise
# every sub-page fires whenever ``page.shop.title`` is on screen.
screens:
  shop.dawn_market:
    parent: shop
    priority: 50
    rules:
    # RU guess «Рынок» (Dawn Market → «Рынок рассвета»?) — VERIFY LIVE.
    - ocr: page.shop.dawn_market.title
      contains: ["Market", "Рынок"]
  shop.mix_match:
    parent: shop
    priority: 55
    rules:
    # RU guess «Микс» (Mix & Match) — VERIFY LIVE (low confidence).
    - ocr: page.shop.mix_match.title
      contains: ["Mix", "Микс"]
  shop.chief_stamina:
    parent: shop
    priority: 55
    rules:
    - match: page.shop.title
      threshold: 0.9
      tab_active: shop.tab.chief_stamina
  shop.ice_conqueror:
    parent: shop
    priority: 55
    rules:
    - match: page.shop.title
      threshold: 0.9
      tab_active: shop.tab.ice_conqueror
  shop.construction_queue:
    parent: shop
    priority: 55
    rules:
    # NOTE: this title OCRs EMPTY even in EN (stylized logo) — OCR can't localize
    # it in any language. RU detection needs a template/tab approach, not OCR.
    # Left on the EN template; RU won't narrow past `shop` until done live.
    - match: page.shop.construction_queue.title
      threshold: 0.9
  shop.daily_deals:
    parent: shop
    priority: 55
    rules:
    # RU «Белая мгла» + EN, fully by OCR (no title crop). contains is a
    # case-insensitive OR of FULL words: «Сделки» (RU «Сделки дня») / «Daily»
    # (EN «Daily Deals»). page.shop.daily_deals.title carries preprocess:
    # title_line — the stylized banner is garbage under plain OCR. RU reads the
    # full word at the WIDER bbox supplied by the wos_ru overlay
    # (games/wos/ru/core/shop/area.yaml); the EN narrow base bbox reads «Daily».
    - ocr: page.shop.daily_deals.title
      contains: ["Daily", "Сделки"]
  shop.weekly_monthly_cards:
    parent: shop
    priority: 55
    rules:
    - match: page.shop.weekly_monthly_cards.title
      threshold: 0.9
    # EN ref reads «Ultra Value» at this title (page is reskinned). RU guess
    # «Ультра» — VERIFY LIVE (low confidence; EN token kept too).
    - ocr: page.shop.weekly_monthly_cards.title
      contains: ["Ultra", "Value", "Ультра"]
  shop.regular_pack:
    parent: shop
    priority: 55
    rules:
    # NOTE: this title OCRs EMPTY even in EN (stylized) — OCR can't localize it.
    # RU needs template/tab, not OCR. Left on the EN template.
    - match: page.shop.regular_pack.title
      threshold: 0.9
  shop.dawn_fund:
    parent: shop
    priority: 55
    rules:
    - match: page.shop.dawn_fund.title
      threshold: 0.9
    # EN reads «Dawn» here (plain OCR, no title_line). RU guess «Фонд»
    # (Dawn Fund → «Фонд рассвета»?) — VERIFY LIVE.
    - ocr: page.shop.dawn_fund.title
      contains: ["Dawn", "Фонд"]
  shop.get_gems:
    parent: shop
    priority: 55
    rules:
    # NOTE: this title OCRs EMPTY even in EN (stylized gem logo) — OCR can't
    # localize it. RU needs template/tab, not OCR. Left on the EN template.
    - match: page.shop.get_gems.title
      threshold: 0.9
  shop.artisans_trove:
    parent: shop
    priority: 55
    rules:
    # RU guess «ремесл» (Artisan's Trove → «…ремесленника»?) — VERIFY LIVE.
    - ocr: artisans_trove.title
      contains: ["Artisan", "ремесл"]
  shop.custom_artistry_chest:
    parent: shop
    priority: 55
    rules:
    # Read the title by OCR, not a template crop: the game reskins this chest
    # (was "Custom Artistry Chest" on a purple banner, now "Custom Armament
    # Chest" on blue), so a fixed crop goes stale on every rename/recolour.
    # "Armament" is the distinctive token (sibling tab is "Custom Pet Chest").
    # RU guess «оруж» (Armament → «…вооружения»?) — VERIFY LIVE.
    - ocr: page.shop.custom_artistry_chest.title
      contains: ["Armament", "оруж"]
  shop:
    priority: 60
    rules:
    - match: page.shop.title
      threshold: 0.9
