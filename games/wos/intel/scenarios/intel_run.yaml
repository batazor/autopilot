# Stamina-budget consumer (demand id: intel_events).
name: Intel run (stamina consumer)
enabled: true
priority: 80_060          # 80_000 base + demand priority 60
node: intel

steps:
  # Read the board's "Refreshes in: HH:MM:SS" timer (seconds) so the MARCH
  # coordinator can pace the next intel run to the real board refresh instead
  # of the static cooldown placeholder.
  - ocr: intel.refresh_in
    type: time
    store: intel.refresh_in

  - while_match: intel.claim_all
    max: 1
    retry:
      attempts: 2
      interval: 500ms
    steps:
      - click: intel.claim_all
      - wait: 1s
      - while_match: button.click_to_continue
        max: 1
        steps:
          - click: button.click_to_continue
          - wait: 500ms
      - while_match: button.tap_anywhere_to_exit
        expected: ["tap anywhere", "для выхода", "нажмите", "любом месте"]
        max: 1
        steps:
          - click: button.tap_anywhere_to_exit
          - wait: 500ms

  # Read the board's «44/90» stamina on-screen so tap_intel_fight can budget the
  # pick (the avatar bar reader is blind on RU). Fresh every run, no cron needed.
  - exec: read_intel_stamina

  - exec: tap_intel_fight
    strategy: best_score
    threshold: 0.72
  # Optional: tap_intel_fight legitimately SKIPS (no markers / all in flight /
  # planner declined the stamina budget) — then no modal ever opens and this
  # run is a claim-only pass that must end cleanly, not die on the wait. The
  # whole modal flow below is gated on the modal actually being detected.
  - wait_screen:
      any: [intel.fight]
      max: 5
      interval: 500ms
      optional: true

  # The tapped pin may be a COMPLETED mission instead of a fight: the tap then
  # claims it and opens the «Награды» rewards popup («Для выхода нажмите в
  # любом месте») — verified live on bs5 2026-07-06, where the run used to end
  # leaving the popup stranded over the board. Dismiss it; non-strict, so a
  # real fight modal (no popup) falls straight through to the fight branch.
  - while_match: button.tap_anywhere_to_exit
    expected: ["tap anywhere", "для выхода", "нажмите", "любом месте"]
    max: 1
    steps:
      - click: button.tap_anywhere_to_exit
      - wait: 800ms

  - cond: currentNode == intel.fight
    steps:
      - click: intel.fight.view
      - wait_screen:
          any: [intel.explore, main_world]
          max: 5
          interval: 500ms

      # The View opens a target panel over the world map; both panel kinds detect as
      # main_world, so branch on the BUTTON COLOUR (survives scrcpy H.264, unlike the
      # title OCR): a blue Explore button ⇒ exploration target, else the orange
      # Attack button ⇒ combat target. (intel.explore.is_blue is a color_check region.)
      - wait: 1s
      - match: intel.explore.is_blue
        steps:
          - click: intel.explore
        else:
          - click: intel.attack
      # Optional: rescue targets («Спасение выживших» / survivor camps) dispatch
      # INSTANTLY on the panel click — no deploy screen ever appears, the march
      # (or instant resolve) just starts and the game drops back to the world
      # map. Verified live on the RU build 2026-07-05: the mission completed and
      # its rewards landed while the old fatal wait was reporting
      # wait_screen_timeout. Combat targets still open heroes.deploy /
      # squad_settings within ~2s, well inside the 10×500ms window, and the
      # conds below run their branch only when the screen actually appeared.
      - wait_screen:
          any: [heroes.deploy, squad_settings]
          max: 10
          interval: 500ms
          optional: true

  - cond: currentNode == heroes.deploy
    steps:
      - click: heroes.deploy.equalize
      - wait: 500ms
      - ocr: heroes.deploy.ttl
        type: string
        store: intel.march_ttl
      - click: heroes.deploy.deploy
      - wait: 1s
      - exec: confirm_intel_march_lease
        ttl_field: intel.march_ttl
        round_trip_multiplier: 2
        extra_seconds: 15
      # (Chaining to the next pin is enqueued atomically by tap_intel_fight the
      # moment a pin is tapped — see maybe_chain_after_tap — so it survives a
      # preemption or result-screen timeout in this run's battle.)

  - cond: currentNode == squad_settings
    steps:
      # POWER GATE (autonomy safety): read the VS strip and retreat from
      # unwinnable pins instead of feeding the army into them (dead troops →
      # hospital → hours of healing downtime). On «flee» the exec itself backs
      # out of the squad screen; the deploy steps below are gated on the
      # decision it stores. Calibrated live on bs5 2026-07-06 (784k vs 75k).
      - exec: intel_power_gate
        max_ratio: 0.8
      - cond: intel.power_gate == "fight"
        steps:
          - click: squad_settings.quick_deploy
          - wait: 200ms
          - click: squad_settings.fight
          - wait: 2s

          - while_match: page.squad_fight.auto
            max: 1
            steps:
              - click: page.squad_fight.auto
              - wait: 1s

          - while_match: page.squad_fight.speed
            max: 1
            steps:
              - click: page.squad_fight.speed

          - wait_screen:
              any: [exploration.victory, exploration.defeat]
              max: 90
              interval: 2s

          - cond: currentNode == exploration.victory
            steps:
              - click: page.exploration.victory.next
              # Optional: victory can drop to a rewards popup or straight to the
              # world map, not always one of these nodes. A hard wait here used
              # to time out and ABORT the whole run before queue_next_intel_run,
              # stranding the rest of the board (live bs3 2026-08-08). Let it
              # settle if it can, else fall through — the chained run re-enters
              # via node: intel and its claim_all clears any leftover popup.
              - wait_screen:
                  any: [squad_settings, intel, main_city]
                  max: 8
                  interval: 500ms
                  optional: true
              - cond: currentNode == squad_settings
                steps:
                  - click: icon.page.back
                  - wait: 1s

          - cond: currentNode == exploration.defeat
            steps:
              - click: button.to_main_city
              - wait: 2s
