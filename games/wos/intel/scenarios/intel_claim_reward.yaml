# Delayed reward pickup — pushed by tap_intel_fight ~40s after a pin is
# dispatched (see schedule_reward_claim). An intel fight sends a march that
# travels, fights, and RETURNS with the reward; the green «Получить все» pill
# only appears on the board once the march is back, after the sweep has already
# cleared the board and the bot has gone home. Without this the reward sat until
# the twice-a-day intel_claim.cron floor (user-reported, bs3 2026-08-09).
#
# Claim-only: navigate to the board, press «Получить все», dismiss the reward
# popups. No fighting — a fresh pin, if any, is left to the coordinator/chain.
name: "Intel: claim reward (delayed)"
enabled: true
priority: 55_000
node: intel

steps:
  - while_match: intel.claim_all
    max: 2
    retry:
      attempts: 2
      interval: 500ms
    steps:
      - click: intel.claim_all
      - wait: 1s
      - while_match: button.click_to_continue
        max: 1
        steps:
          - click: button.click_to_continue
          - wait: 500ms
      - while_match: button.tap_anywhere_to_exit
        expected: ["tap anywhere", "для выхода", "нажмите", "любом месте"]
        max: 1
        steps:
          - click: button.tap_anywhere_to_exit
          - wait: 500ms
