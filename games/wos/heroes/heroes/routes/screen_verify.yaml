screens:
  heroes:
    priority: 30
    rules:
    # OCR the "Heroes" header (top-left) rather than template-matching the whole
    # grid: the grid template goes stale the moment the roster/sort changes, which
    # made navigation to the heroes screen fail (verify never passed). The title
    # is stable regardless of which heroes are shown. Mirrors hero.recruitment.
    - ocr: heroes.title
      # RU «Герои» (bottom-bar label confirmed on bs5; page title assumed same word) — VERIFY LIVE.
      contains: [Heroes, Герои]

  hero.recruitment:
    priority: 30
    rules:
    - ocr: hero.recruitment.title
      # RU guess «Наём» — VERIFY LIVE.
      contains: [Recruitment, Наём]

  # Per-hero detail page (reached from the grid). Anchored on the bottom-left
  # "Stats" tab via OCR: the wiki-button template (top-right) degrades under
  # scrcpy H.264 and left the navigator calling this page UNKNOWN — so it could
  # not route away (the page.heroes.unit -> heroes back edge never fired) and
  # stranded any scenario that ended on a hero card. "Stats" is present on every
  # hero detail card (owned heroes AND the recruit variant), so OCR'ing it is the
  # stable anchor. Verified live on bs3 (conf 0.96).
  page.heroes.unit:
    priority: 35
    rules:
    - ocr: page.heroes.unit.stats
      # RU «Показатели» (bottom-left tab; verified live on bs5 hero card «Джина»).
      contains: [Stats, Показател]
      threshold: 0.8

  # New-hero ("SSR/SR · NEW") unlock celebration page. Anchored on the bottom
  # "Tap anywhere to continue" caption via OCR: the full-frame close template
  # degrades under scrcpy H.264 (~0.84 live on bs3, below the 0.9 match floor)
  # and left the page detected as UNKNOWN, so read_new_hero_unlock never fired.
  # The caption is identical on every hero's unlock page → stable anchor (conf
  # 0.96 live). Mirrors the page.heroes.unit "Stats" OCR fix above.
  heroes.sr.new:
    priority: 25
    rules:
    - ocr: heroes.sr.new.tap_anywhere
      # RU caption «Нажмите в любом месте…» (token «любом месте», mirrors arena.result) — VERIFY LIVE.
      contains: ["tap anywhere", "любом месте"]
