# Heroes screen overlay rules. Uses regions defined in this module's area.yaml.
overlay:
- name: heroes.recruit.scan
  region: heroes.recruit
  isRedDot: true
  screens:
    - heroes
  steps:
    - push_scenario: free_recruitments_today

# On a hero card, a red dot on the book/wiki icon means an unclaimed biography
# reward (diamonds) — open the Story and claim the chest. Cleared on claim, so
# this stops firing per hero.
- name: heroes.unit.bio.scan
  region: page.heroes.unit.wiki
  isRedDot: true
  screens:
    - page.heroes.unit
  steps:
    - push_scenario: claim_hero_bio

# New-hero unlock celebration page ("SSR/SR · NEW", "Tap anywhere to continue").
# Keyed off the bottom caption OCR (same anchor screen_verify uses) rather than
# the full-frame close template, which degrades under scrcpy H.264 (~0.84 live).
# Fires device-level (the page can appear before identity is known) and reads +
# records the hero before generic navigation blind-taps the page away. ttl
# throttles the re-push while read_new_hero_unlock works through stacked pages.
- name: heroes.sr.new.unlock
  region: heroes.sr.new.tap_anywhere
  action: text
  type: string
  expected:
    - tap anywhere
  threshold: 0.6
  device_level: true
  ttl: 5
  screens:
    - heroes.sr.new
  steps:
    - push_scenario: read_new_hero_unlock
